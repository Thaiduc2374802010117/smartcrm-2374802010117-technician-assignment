# Dựng toàn bộ hệ thống bằng HAI lệnh:  cp .env.example .env  ->  docker compose up -d --build
# Giao diện: http://localhost:5500 · API: http://localhost:3000 · kiểm tra: http://localhost:3000/health
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}            # lấy từ .env – không ghi cứng
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Postgres tự chạy theo thứ tự tên khi volume còn trống: bảng theo DDL BT1, rồi dữ liệu mẫu
      - ./db/migrations/001_tao_bang_theo_ddl_bt1.sql:/docker-entrypoint-initdb.d/001_tao_bang.sql:ro
      - ./db/seed/001_du_lieu_mau.sql:/docker-entrypoint-initdb.d/002_du_lieu_mau.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10
    # không có ports: CSDL chỉ mở trong mạng nội bộ (tránh cấu hình sai – OWASP A02)

  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db                          # TÊN DỊCH VỤ, không phải localhost
      DB_PORT: "5432"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db: { condition: service_healthy }   # chờ CSDL SẴN SÀNG, không chỉ chờ khởi động
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      retries: 6

  web:
    image: nginx:1.27-alpine               # phục vụ giao diện tĩnh src/frontend
    volumes:
      - ./src/frontend:/usr/share/nginx/html:ro
    ports:
      - "${WEB_PORT:-5500}:80"
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      retries: 6

volumes:
  dbdata: {}
